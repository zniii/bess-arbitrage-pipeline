# Local S3-compatible object store (MinIO) so the pipeline runs without AWS.
#   docker compose up -d
#   then set in .env: AWS_ENDPOINT_URL=http://localhost:9000 and the keys below.
# The bucket must exist: `docker compose run --rm create-bucket`.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: ["minio-data:/data"]
  create-bucket:
    image: minio/mc:latest
    profiles: ["tools"]
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/bess-datalake"
volumes:
  minio-data:
